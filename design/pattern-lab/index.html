<!DOCTYPE html>
<!--
  Gathir Pattern Lab: design-time explorer for the app's generative art (docs/PLAN.md §11).
  Open this file directly in a browser (no server needed). Geometry comes from geometry.js,
  the same maths src/ui/patterns/geometry.ts runs on the phone.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gathir Pattern Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5/1.11.3/p5.min.js"
  onerror="var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js';s.onload=function(){window.dispatchEvent(new Event('p5-ready'))};document.head.appendChild(s);"></script>
<script src="geometry.js"></script>
<script src="palettes.js"></script>
<script src="render.js"></script>
<script src="boteh-field.js"></script>
<script src="kani-weave.js"></script>
<script src="sozni-vine.js"></script>
<script src="chinar-fall.js"></script>
<script src="paisley-confetti.js"></script>
<script src="thread-weave-logo.js"></script>
<style>
  :root {
    --bg: #FFF8EE; --surface: #FFFFFF; --sunken: #F6ECDD; --border: #E8D9C4;
    --text: #2B1A12; --muted: #6B5446; --primary: #C62F17; --on-primary: #FFFFFF; --teal: #0B6E77;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15101F; --surface: #1F1830; --sunken: #100C18; --border: #2E2645;
      --text: #F8EEDF; --muted: #BFAE9C; --primary: #FF7452; --on-primary: #15101F; --teal: #4CC9D1;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 400 15px/1.5 Manrope, system-ui, sans-serif;
    min-height: 100vh; display: grid; grid-template-columns: 300px 1fr;
  }
  aside {
    background: var(--surface); border-inline-end: 1px solid var(--border);
    padding: 24px 20px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto; max-height: 100vh;
  }
  h1 { font: 700 26px/1.15 Fraunces, Georgia, serif; }
  .lede { color: var(--muted); font-size: 13px; margin-top: 6px; }
  h2 { font: 600 17px/1.3 Fraunces, Georgia, serif; margin-bottom: 10px; }
  nav { display: flex; flex-direction: column; gap: 4px; }
  nav button {
    text-align: start; border: 1px solid transparent; background: none; color: var(--text);
    font: 600 14px Manrope, sans-serif; padding: 10px 12px; border-radius: 12px; cursor: pointer; min-height: 44px;
  }
  nav button:hover { background: var(--sunken); }
  nav button[aria-current="true"] { background: var(--sunken); border-color: var(--border); }
  nav button small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .control { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; align-items: center; margin-bottom: 12px; }
  .control label { font-weight: 600; font-size: 13px; }
  .control output { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  .control input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--primary); }
  .seed-row { display: flex; gap: 6px; }
  .seed-row input { flex: 1; min-width: 0; font: 600 15px Manrope; padding: 8px 10px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--sunken); color: var(--text); font-variant-numeric: tabular-nums; }
  .btn {
    font: 700 14px Manrope, sans-serif; border-radius: 12px; padding: 10px 14px; min-height: 44px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
  }
  .btn:hover { background: var(--sunken); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions .wide { grid-column: 1 / -1; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
  main { padding: 32px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .stage-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .stage-head h2 { font-size: 24px; margin: 0; }
  .twin { color: var(--muted); font-size: 13px; }
  .twin code { font: 600 13px ui-monospace, monospace; color: var(--text); }
  #blurb { color: var(--muted); max-width: 64ch; }
  #stage { border-radius: 20px; overflow: hidden; border: 1px solid var(--border); align-self: flex-start; max-width: 100%; }
  #stage canvas { display: block; max-width: 100%; height: auto !important; }
  #info { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .keys { font-size: 12px; color: var(--muted); }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; }
    aside { max-height: none; border-inline-end: 0; border-bottom: 1px solid var(--border); }
    main { padding: 16px; }
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>Pattern Lab</h1>
    <p class="lede">Gathir's generative art, drawn from the same seeded maths the phone uses. Pick a seed here, put it in the app.</p>
  </header>

  <section>
    <h2>Sketch</h2>
    <nav id="sketches" aria-label="Sketches"></nav>
  </section>

  <section>
    <h2>Seed</h2>
    <div class="seed-row">
      <button class="btn" id="prev" aria-label="Previous seed">‹</button>
      <input id="seed-input" type="number" min="0" max="999999" aria-label="Seed">
      <button class="btn" id="next" aria-label="Next seed">›</button>
      <button class="btn" id="random">Random</button>
    </div>
  </section>

  <section>
    <h2>Parameters</h2>
    <div class="control">
      <label for="seed">Seed</label><output id="seed-out"></output>
      <input type="range" id="seed" min="0" max="9999" step="1">
    </div>
    <div class="control">
      <label for="density">Density</label><output id="density-out"></output>
      <input type="range" id="density" min="0" max="1" step="0.01">
    </div>
    <div class="control">
      <label for="palette">Palette</label><output id="palette-out"></output>
      <input type="range" id="palette" min="0" max="2" step="1">
    </div>
    <div class="control">
      <label for="speed">Speed</label><output id="speed-out"></output>
      <input type="range" id="speed" min="0" max="3" step="0.05">
    </div>
  </section>

  <section class="actions">
    <button class="btn primary" id="svg">Export SVG</button>
    <button class="btn primary" id="png">Save PNG</button>
    <button class="btn" id="replay">Replay</button>
    <button class="btn" id="reset">Reset</button>
    <p class="keys wide">Keys: S saves PNG, V exports SVG, space pauses, ← → change seed.</p>
  </section>
</aside>

<main>
  <div class="stage-head">
    <h2 id="title"></h2>
    <p class="twin">App twin: <code id="twin"></code></p>
  </div>
  <p id="blurb"></p>
  <div id="stage"></div>
  <p id="info" aria-live="polite"></p>
</main>

<script>
(function () {
  var ZOOM = 2;
  var sketches = window.GathirSketches;
  var palettes = window.GathirPalettes;
  var current = sketches[0];
  var params = Object.assign({}, current.defaults);
  var scene = null;
  var time = 0;
  var paused = false;
  var instance = null;

  var $ = function (id) { return document.getElementById(id); };

  function rebuild() {
    scene = current.build(params, current.dp.w, current.dp.h, palettes[params.palette]);
  }

  function frameNow() {
    return current.frame(scene, time, params, palettes[params.palette]);
  }

  function syncControls() {
    $('seed').value = Math.min(9999, params.seed);
    $('seed-input').value = params.seed;
    $('seed-out').textContent = params.seed;
    $('density').value = params.density;
    $('density-out').textContent = Number(params.density).toFixed(2);
    $('palette').value = params.palette;
    $('palette-out').textContent = palettes[params.palette].name;
    $('speed').value = params.speed;
    $('speed-out').textContent = Number(params.speed).toFixed(2) + '×';
    $('title').textContent = current.title;
    $('twin').textContent = current.app;
    $('blurb').textContent = current.blurb;
    Array.prototype.forEach.call($('sketches').children, function (b) {
      b.setAttribute('aria-current', String(b.dataset.id === current.id));
    });
  }

  function setParam(key, value) {
    params[key] = value;
    if (key !== 'speed') rebuild();
    syncControls();
  }

  function fileBase() {
    return 'gathir-' + current.id + '-seed' + params.seed + '-p' + params.palette;
  }

  function download(name, text, type) {
    var url = URL.createObjectURL(new Blob([text], { type: type }));
    var a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function exportSVG() {
    var f = frameNow();
    download(fileBase() + '.svg', GathirRender.layersToSVG(current.dp.w, current.dp.h, f.background, f.layers), 'image/svg+xml');
  }

  function start() {
    if (instance) instance.remove();
    rebuild();
    time = 0;
    instance = new p5(function (p) {
      p.setup = function () {
        p.pixelDensity(Math.max(2, window.devicePixelRatio || 1));
        p.createCanvas(current.dp.w * ZOOM, current.dp.h * ZOOM);
        // p5's own PRNG/noise are seeded too, but all geometry uses geometry.js so the
        // lab and the app agree bit for bit.
        p.randomSeed(params.seed);
        p.noiseSeed(params.seed);
      };
      p.draw = function () {
        if (!paused) time += (Math.min(p.deltaTime, 64) / 1000) * params.speed;
        var f = frameNow();
        var ctx = p.drawingContext;
        ctx.save();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, p.width * p.pixelDensity(), p.height * p.pixelDensity());
        ctx.restore();
        ctx.save();
        ctx.scale(ZOOM, ZOOM);
        if (f.background) {
          ctx.fillStyle = f.background;
          ctx.fillRect(0, 0, current.dp.w, current.dp.h);
        }
        GathirRender.drawLayers(ctx, f.layers);
        ctx.restore();
        if (p.frameCount % 15 === 0) $('info').textContent = f.info + ' · ' + current.dp.w + '×' + current.dp.h + ' dp';
      };
      p.keyPressed = function () {
        if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
        if (p.key === 's' || p.key === 'S') p.saveCanvas(fileBase(), 'png');
        if (p.key === 'v' || p.key === 'V') exportSVG();
        if (p.key === ' ') { paused = !paused; return false; }
        if (p.keyCode === p.LEFT_ARROW) setParam('seed', Math.max(0, params.seed - 1));
        if (p.keyCode === p.RIGHT_ARROW) setParam('seed', params.seed + 1);
      };
    }, $('stage'));
    syncControls();
  }

  function selectSketch(s) {
    current = s;
    params = Object.assign({}, s.defaults);
    start();
  }

  function boot() {
    sketches.forEach(function (s) {
      var b = document.createElement('button');
      b.dataset.id = s.id;
      b.innerHTML = s.title + '<small>' + s.app + '</small>';
      b.addEventListener('click', function () { selectSketch(s); });
      $('sketches').appendChild(b);
    });
    ['density', 'palette', 'speed', 'seed'].forEach(function (k) {
      $(k).addEventListener('input', function (e) { setParam(k, Number(e.target.value)); });
    });
    $('seed-input').addEventListener('change', function (e) { setParam('seed', Math.max(0, Math.floor(Number(e.target.value) || 0))); });
    $('prev').addEventListener('click', function () { setParam('seed', Math.max(0, params.seed - 1)); });
    $('next').addEventListener('click', function () { setParam('seed', params.seed + 1); });
    $('random').addEventListener('click', function () { setParam('seed', Math.floor(Math.random() * 10000)); });
    $('svg').addEventListener('click', exportSVG);
    $('png').addEventListener('click', function () { if (instance) instance.saveCanvas(fileBase(), 'png'); });
    $('replay').addEventListener('click', function () { time = 0; paused = false; });
    $('reset').addEventListener('click', function () { selectSketch(current); });
    start();
  }

  if (window.p5) boot();
  else window.addEventListener('p5-ready', boot, { once: true });
})();
</script>
</body>
</html>
