name: Android APK

# Builds an installable Gathir APK on GitHub's free runners (they include the Android SDK)
# and publishes it on the "apk-latest" GitHub Release so anyone can download it for free.
on:
  push:
    branches: [main, 'claude/**']
    paths-ignore: ['docs/**', '**/*.md', 'design/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npx jest --ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_OFFLINE: '1'

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
        env:
          NODE_ENV: production

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Gathir-${VERSION}-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk dist/Gathir-latest.apk
          ls -lh dist

      - name: Keep APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gathir-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish to the apk-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Gathir APK (latest build)
          prerelease: true
          make_latest: false
          body: |
            Free Android APK for Gathir, built from `${{ github.ref_name }}` (${{ github.sha }}).
            Download **Gathir-latest.apk** on the phone, open it, and allow "Install unknown apps" when Android asks.
            This test build is signed with the standard Expo/React Native test key. Keep using APKs from this page so updates install over the old app and keep its data.
          files: dist/*.apk
